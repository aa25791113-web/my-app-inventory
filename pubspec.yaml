name: my_app_inventory
description: Offline-first Arabic inventory manager for Android and Windows.
publish_to: "none"
version: 3.1.0+31

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image: ^4.5.4
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/launcher_icon.png
  adaptive_icon_background: '#087F68'
  adaptive_icon_foreground: assets/launcher_icon.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/launcher_icon.png
    icon_size: 48
