name: my_app_inventory
description: APP LOL — Arabic offline inventory, sales and invoice manager.
publish_to: "none"
version: 3.8.0+40

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image: ^4.5.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  shorebird_code_push: ^2.0.7
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.1
  workmanager: ^0.10.10
  math_expressions: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/launcher_icon.png
  adaptive_icon_background: '#062B3B'
  adaptive_icon_foreground: assets/launcher_icon.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/launcher_icon.png
    icon_size: 48

dependency_overrides:
  # image 4.13.x calls ZLibDecoder.decodeLazy; archive added that API in 4.4.0.
  # Keep this pinned to the first compatible release to avoid the 4.0.x API mismatch.
  archive: 4.4.0
