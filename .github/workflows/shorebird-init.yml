name: Initialize Shorebird updates
on:
  workflow_dispatch:
    inputs:
      org_id:
        description: "Optional Shorebird organization ID if the account belongs to multiple organizations"
        required: false
        type: string
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      INPUT_ORG_ID: ${{ inputs.org_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Prepare generated Android project
        run: flutter create --platforms=android --project-name my_app_inventory --org com.myapp.inventory .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Shorebird app and configuration
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Add SHOREBIRD_TOKEN to repository Actions secrets before running this workflow."
            exit 1
          fi
          if [ -n "$INPUT_ORG_ID" ]; then
            shorebird init --org-id "$INPUT_ORG_ID" --display-name "MY APP"
          else
            shorebird init --display-name "MY APP"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path("shorebird.yaml")
          text = p.read_text()
          if "auto_update:" not in text:
              text = text.rstrip() + "\nauto_update: false\n"
          p.write_text(text)
          PY
      - name: Commit Shorebird configuration to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          if git diff --cached --quiet; then
            echo "No Shorebird configuration changes to commit."
          else
            git commit -m "Initialize Shorebird in-app updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
