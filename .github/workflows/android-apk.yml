name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lib/**", "pubspec.yaml", ".github/workflows/android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter create --platforms=android --project-name my_app_inventory --org com.myapp.inventory .
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: my-app-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
