name: Build Android APK
concurrency:
  group: android-release-v3-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "ملاحظات الإصدار التي ستظهر في إشعار التحديث"
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter create --platforms=android,windows --project-name my_app_inventory --org com.myapp.inventory .
      - name: Remove only Flutter's generated sample test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sample = Path('test/widget_test.dart')
          if sample.exists() and 'package:material_ui/material_ui.dart' in sample.read_text():
              sample.unlink()
              print('Removed incompatible Flutter template test; project tests are preserved.')
          PY
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          target = next((p for p in candidates if p.exists()), None)
          if target is None:
              raise SystemExit("Android app Gradle file was not generated")
          source = target.read_text()
          updated, count = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', source, count=1)
          if count == 0:
              updated, count = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', source, count=1)
          if count == 0:
              updated, count = re.subn(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', source, count=1)
          if count == 0:
              raise SystemExit(f"Could not locate compileSdk setting in {target}")
          target.write_text(updated)
          print(f"Configured {target} to compileSdk 36")
          PY
      - name: Configure Android notification permissions and scheduler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")
          source = gradle.read_text()
          if gradle.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in source:
                  source, count = re.subn(r"compileOptions\s*\{", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", source, count=1)
                  if count == 0:
                      source, count = re.subn(r"android\s*\{", "android {\n    compileOptions { isCoreLibraryDesugaringEnabled = true }", source, count=1)
                  if count == 0:
                      raise SystemExit("Could not enable core library desugaring")
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if "coreLibraryDesugaringEnabled true" not in source:
                  source, count = re.subn(r"compileOptions\s*\{", "compileOptions {\n        coreLibraryDesugaringEnabled true", source, count=1)
                  if count == 0:
                      source, count = re.subn(r"android\s*\{", "android {\n    compileOptions { coreLibraryDesugaringEnabled true }", source, count=1)
                  if count == 0:
                      raise SystemExit("Could not enable core library desugaring")
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in source:
              if re.search(r"dependencies\s*\{", source):
                  source = re.sub(r"dependencies\s*\{", lambda m: m.group(0) + "\n    " + dependency, source, count=1)
              else:
                  source += "\ndependencies {\n    " + dependency + "\n}\n"
          gradle.write_text(source)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          for permission in [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]:
              if permission not in xml:
                  xml, count = re.subn(r"(<manifest\b[^>]*>)", r"\1\n    " + permission, xml, count=1)
                  if count != 1:
                      raise SystemExit("Could not add Android permission: " + permission)
          receivers = """    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>"""
          if "ScheduledNotificationReceiver" not in xml:
              xml, count = re.subn(r"(<application\b[^>]*>)", r"\1\n" + receivers, xml, count=1)
              if count != 1:
                  raise SystemExit("Could not register notification receivers in AndroidManifest.xml")
          manifest.write_text(xml)
          print("Configured notification permission, boot rescheduling and Java desugaring")
          PY
      - name: Generate launcher icon and app label
        run: |
          python -m pip install --quiet pillow
          python tool/generate_icon.py
          sed -i 's/android:label="my_app_inventory"/android:label="MY APP"/' android/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]
          for permission in permissions:
              if permission not in source:
                  import re
                  source, count = re.subn(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, source, count=1)
                  if count != 1:
                      raise SystemExit("Could not insert Android permission: " + permission)
          manifest.write_text(source)
          print("Verified Android camera and internet permissions in manifest")
          PY
      - run: flutter pub get
      - name: Align Android plugin compile SDK versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  try:
                      source = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = source
                  updated = re.sub(r'(?m)^(\s*compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|\d+)', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdk\s+)(?:flutter\.compileSdkVersion|\d+)', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdkVersion\s+)(?:flutter\.compileSdkVersion|\d+)', r'\g<1>36', updated)
                  if updated != source:
                      path.write_text(updated)
                      changed.append(str(path))
          print("Aligned compile SDK in", len(changed), "Gradle files")
          PY
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - name: Publish Shorebird-enabled Android release APK
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Add SHOREBIRD_TOKEN to repository Actions secrets before running this workflow."
            exit 1
          fi
          shorebird release android --artifact apk --target-platform android-arm64
      - name: Publish version and release notes for in-app update alerts
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          pubspec = Path("pubspec.yaml").read_text()
          match = re.search(r"(?m)^version:\s*([^\s]+)", pubspec)
          if not match:
              raise SystemExit("Could not read version from pubspec.yaml")
          version = match.group(1)
          apks = list(Path("build/app/outputs/flutter-apk").glob("*.apk"))
          if not apks:
              raise SystemExit("Shorebird release succeeded but no APK artifact was found.")
          size_bytes = sum(p.stat().st_size for p in apks)
          if size_bytes < 1024:
              size_label = f"{size_bytes} بايت"
          elif size_bytes < 1024 * 1024:
              size_label = f"{size_bytes / 1024:.1f} كيلوبايت"
          else:
              size_label = f"{size_bytes / (1024 * 1024):.2f} ميجابايت"
          manifest = {
              "release_version": version,
              "patch_number": 0,
              "track": "stable",
              "size_bytes": size_bytes,
              "size_label": size_label,
              "notes": os.environ.get("RELEASE_NOTES", "").strip() or "إصدار جديد يتضمن تحسينات وإصلاحات.",
              "published_at": datetime.now(timezone.utc).isoformat()
          }
          Path("update_manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m "Publish Android release metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: my-app-shorebird-android-apk-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
